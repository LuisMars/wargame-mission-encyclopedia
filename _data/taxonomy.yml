        name: { en: Pickup and Extract, es: "Recogida y extracci\xF3n" }
      - id: theft_return
        name: { en: Theft and Return, es: Robo y retorno }
      - id: delivery
        name: { en: Delivery, es: Entrega }
      - id: recover_carry
        name: { en: Recover and Carry, es: Recuperar y transportar }
  - id: escort_intent
    name: { en: Escort, es: Escolta }
    children:
