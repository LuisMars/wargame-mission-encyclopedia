      - id: public_events
        name: { en: Public Events, es: "Eventos p\xFAblicos" }
  - id: hidden_objectives
    name: { en: Hidden Objectives, es: Objetivos ocultos }
    children:
      - id: secret_secondaries
        name: { en: Secret Secondaries, es: Secundarios secretos }
      - id: drafted_tasks
        name: { en: Drafted Secret Tasks, es: Tareas secretas seleccionadas }
      - id: personal_vs_shared
        name: { en: Personal vs Shared Goals, es: Objetivos personales vs compartidos }
  - id: fog_of_war
