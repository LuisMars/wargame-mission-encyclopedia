        name: { en: Stealth Movement, es: Movimiento sigiloso }
      - id: alarm_management
        name: { en: Alarm Management, es: "Gesti\xF3n de alarmas" }
      - id: disguise_bluff
        name: { en: Disguise and Bluff, es: Disfraz y farol }
  - id: observation
    name: { en: Observation, es: "Observaci\xF3n" }
    children:
      - id: line_of_sight_scan
        name: { en: Line of Sight Scan, es: "Escaneo por l\xEDnea de visi\xF3n" }
      - id: proximity_reveal
        name: { en: Proximity Reveal, es: "Revelaci\xF3n por proximidad" }
      - id: triangulation
        name: { en: Triangulation, es: "Triangulaci\xF3n" }

# ----------------------------------------------------------
# Facet C — Victory Accounting  (how winner is decided)
# ----------------------------------------------------------
victory:
  cadence:
    - id: progressive
      name: { en: Progressive, es: Progresivo }
    - id: endgame
      name: { en: Endgame Only, es: Solo al final }
    - id: hybrid
      name: { en: Hybrid, es: "H\xEDbrido" }
  win_form:
    - id: most_after_n
      name: { en: Most Points after N Rounds, es: "M\xE1s puntos tras N rondas" }
    - id: first_to_x
      name: { en: First to X Points, es: Primero en alcanzar X puntos }
    - id: sudden_death
      name: { en: Sudden Death, es: "Muerte s\xFAbita" }
    - id: threshold
      name: { en: Threshold Completion, es: Alcanzar umbral }
    - id: last_standing
      name: { en: Last Standing, es: "\xDAltimo en pie" }
    - id: binary
      name: { en: Binary (pass/fail), es: "Binario (\xE9xito/fracaso)" }
    - id: survival
      name: { en: Survival to Time Limit, es: "Supervivencia hasta l\xEDmite de tiempo" }
  caps:
    - id: per_round_cap
      name: { en: Per-Round Cap, es: "L\xEDmite por ronda" }
    - id: per_object_cap
      name: { en: Per-Object Cap, es: "L\xEDmite por objeto" }
    - id: completion_threshold
      name: { en: Completion Threshold, es: "Umbral de finalización" }

