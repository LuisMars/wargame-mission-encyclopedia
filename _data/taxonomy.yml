        name: { en: VIP Escort, es: Escolta de VIP }
      - id: convoy_escort
        name: { en: Convoy Escort, es: Escolta de convoy }
      - id: prisoner_transfer
        name: { en: Prisoner Transfer, es: Transferencia de prisioneros }
  - id: sabotage_intent
    name: { en: Sabotage, es: Sabotaje }
    children:
      - id: plant_detonate
        name: { en: Plant and Detonate, es: Colocar y detonar }
      - id: direct_demolition
        name: { en: Direct Demolition, es: "Demolici\xF3n directa" }
      - id: disable_contaminate
        name: { en: Disable or Contaminate, es: Desactivar o contaminar }
  - id: recon_intent
    name: { en: Recon, es: Reconocimiento }
    children:
      - id: scan_map
        name: { en: Scan or Map, es: Escanear o mapear }
      - id: mark_spot
        name: { en: Mark or Spot, es: "Marcar o se\xF1alar" }
      - id: triangulate
        name: { en: Triangulate, es: Triangular }
  - id: breakthrough_intent
    name: { en: Breakthrough, es: Avance }
    children:
      - id: cross_the_line
        name: { en: Cross the Line, es: "Cruzar la l\xEDnea" }
      - id: infiltrate_exfiltrate
        name: { en: Infiltrate then Exfiltrate, es: Infiltrar y exfiltrar }
      - id: break_out
        name: { en: Break Out, es: Escapar }
      - id: competitive_pathing
        name: { en: Competitive Pathing, es: Ruta competitiva }
  - id: defense_intent
    name: { en: Defense, es: Defensa }
    children:
      - id: holdout_survival
        name: { en: Holdout Survival, es: Supervivencia }
      - id: asset_defense
        name: { en: Asset Defense, es: Defensa de activos }
      - id: evac_defense
        name: { en: Evac Defense, es: "Defensa de evacuaci\xF3n" }
      - id: siege_breach
        name: { en: Siege Breach, es: Brecha de asedio }
  - id: progress_intent
    name: { en: Progress, es: Progreso }
    children:
      - id: clocks
        name: { en: Clocks, es: Relojes de progreso }
      - id: assemble
        name: { en: Assemble, es: Ensamblar }
      - id: cleanse_convert
        name: { en: Cleanse or Convert, es: Purificar o convertir }
      - id: sequential_unlock
        name: { en: Sequential Unlock, es: Desbloqueo secuencial }
  - id: influence_intent
    name: { en: Influence, es: Influencia }
    children:
      - id: civilian_persuasion
        name: { en: Civilian Persuasion, es: "Persuasi\xF3n civil" }
      - id: negotiation
        name: { en: Negotiation, es: "Negociaci\xF3n" }
      - id: crowd_control
        name: { en: Crowd Control, es: Control de multitudes }
  - id: stealth_intent
    name: { en: Stealth, es: Sigilo }
