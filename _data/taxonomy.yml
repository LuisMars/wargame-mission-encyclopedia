        name: { en: Network Control, es: Control de red }
  - id: elimination_intent
    name: { en: Elimination, es: "Eliminaci\xF3n" }
    children:
      - id: total_attrition
        name: { en: Total Attrition, es: Desgaste total }
      - id: key_target_removal
        name: { en: Key Target Removal, es: "Eliminaci\xF3n de objetivo clave" }
