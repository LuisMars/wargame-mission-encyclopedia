# ============================================================
# Wargame Mission Encyclopedia — Taxonomy
# ============================================================
# Six facets, each a tree.  Archetype front-matter references
# leaf IDs from these trees.
# ============================================================

# ----------------------------------------------------------
# Families  (11 — the top-level browse categories)
# ----------------------------------------------------------
families:
  - id: control
    name: { en: Control, es: Control }
    description:
      en: Missions focused on claiming and holding territory
      es: Misiones centradas en reclamar y mantener territorio
  - id: elimination
    name: { en: Elimination, es: "Eliminaci\xF3n" }
    description:
      en: Missions focused on destroying enemy forces or key targets
      es: Misiones centradas en destruir fuerzas enemigas u objetivos clave
  - id: loot
    name: { en: Loot, es: "Bot\xEDn" }
    description:
      en: Missions focused on retrieving, stealing, or extracting objects
      es: Misiones centradas en recuperar, robar o extraer objetos
  - id: escort
    name: { en: Escort, es: Escolta }
    description:
      en: Missions focused on moving VIPs, convoys, or prisoners
      es: Misiones centradas en mover VIPs, convoyes o prisioneros
  - id: sabotage
    name: { en: Sabotage, es: Sabotaje }
    description:
      en: Missions focused on destroying or disabling enemy assets
      es: Misiones centradas en destruir o desactivar activos enemigos
  - id: recon
    name: { en: Recon, es: Reconocimiento }
    description:
      en: Missions focused on gathering intelligence
      es: Misiones centradas en recopilar inteligencia
  - id: breakthrough
    name: { en: Breakthrough, es: Avance }
    description:
      en: Missions focused on crossing enemy lines, escaping, or racing
      es: Misiones centradas en cruzar líneas enemigas, escapar o competir en velocidad
  - id: defense
    name: { en: Defense, es: Defensa }
    description:
      en: Missions focused on holding out against pressure or storming fortifications
      es: Misiones centradas en resistir bajo presión o asaltar fortificaciones
  - id: progress
    name: { en: Progress, es: Progreso }
    description:
      en: Missions focused on completing multi-step objectives, puzzles, or constructions
      es: Misiones centradas en completar objetivos de varios pasos, rompecabezas o construcciones
  - id: influence
    name: { en: Influence, es: Influencia }
    description:
      en: Missions involving civilians, politics, or reputation
      es: Misiones que involucran civiles, política o reputación
  - id: stealth
    name: { en: Stealth, es: Sigilo }
    description:
      en: Missions focused on concealment, detection avoidance, and covert operations
      es: Misiones centradas en ocultamiento, evasión de detección y operaciones encubiertas

# ----------------------------------------------------------
# Facet A — Objective Intent  (what victory is about)
# ----------------------------------------------------------
intent:
